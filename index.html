<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>System Monitor</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f172a; --text: #d4d4d4; }
        body, html { margin: 0; padding: 0; height: 100vh; background: var(--bg); font-family: monospace; overflow: hidden; }
        
        /* 管理员看到的控制台布局 */
        #admin-panel { display: flex; flex-direction: column; height: 100vh; color: white; }
        .controls { padding: 20px; background: #1e293b; display: flex; gap: 10px; border-bottom: 1px solid #334155; }
        .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-run { background: #10b981; color: white; }
        .btn-share { background: #6366f1; color: white; }
        
        /* 核心终端窗口（对方只看这个） */
        #terminal-container { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }
        .terminal-header { background: #2d2d2d; height: 30px; display: flex; align-items: center; padding-left: 15px; color: #8e8e93; font-size: 12px; }
        #terminal-body { flex: 1; padding: 15px; overflow-y: auto; line-height: 1.5; font-size: 14px; color: #4ade80; }
        
        /* 观众模式：隐藏所有按钮，只留终端 */
        body.viewer #admin-panel .controls { display: none !important; }
        body.viewer #terminal-container { height: 100vh; }
    </style>
</head>
<body>

    <div id="admin-panel">
        <div class="controls">
            <button class="btn btn-share" id="share-btn" onclick="startShare()">🔗 1. 点击开启分享</button>
            <button class="btn btn-run" id="run-btn" onclick="runDemo()">⚡ 2. 点击运行(看效果)</button>
            <span id="status-msg" style="margin-left:10px; font-size:13px; color:#94a3b8; align-self:center;"></span>
        </div>

        <div id="terminal-container">
            <div class="terminal-header">● ● ● REMOTE_TERMINAL_OUTPUT</div>
            <div id="terminal-body">
                <div>[System] 等待指令中...</div>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let connections = [];

        // 核心逻辑：如果是链接带了参数，就切换到“观众模式”
        const params = new URLSearchParams(window.location.search);
        if (params.get('view')) {
            document.body.classList.add('viewer');
            initViewer(params.get('view'));
        }

        // --- 你的操作（主机） ---
        function startShare() {
            peer = new Peer();
            peer.on('open', (id) => {
                const shareLink = window.location.href.split('?')[0] + '?view=' + id;
                document.getElementById('status-msg').innerText = "分享成功！";
                // 弹窗让你复制链接
                const tempInput = document.createElement("input");
                document.body.appendChild(tempInput);
                tempInput.value = shareLink;
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                alert("分享链接已自动复制到剪贴板，直接发给对方即可！\n链接中只包含终端，对方看不见按钮。");
            });
            peer.on('connection', (conn) => {
                connections.push(conn);
                conn.send({ type: 'INIT', html: document.getElementById('terminal-body').innerHTML });
            });
        }

        // --- 对方的操作（观众） ---
        function initViewer(hostId) {
            const viewer = new Peer();
            viewer.on('open', () => {
                const conn = viewer.connect(hostId);
                conn.on('data', (data) => {
                    if (data.type === 'INIT') document.getElementById('terminal-body').innerHTML = data.html;
                    if (data.type === 'LOG') addLog(data.msg, false);
                });
            });
        }

        // 通用打日志函数
        function addLog(msg, isHost = true) {
            const body = document.getElementById('terminal-body');
            const div = document.createElement('div');
            div.innerText = `> ${msg}`;
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
            
            // 如果你是主机，要把这一行发给所有人
            if (isHost && connections.length > 0) {
                connections.forEach(c => c.send({ type: 'LOG', msg: msg }));
            }
        }

        // 模拟运行
        async function runDemo() {
            const steps = ["正在连接全球节点...", "安全验证通过...", "IP: 114.240.x.x 已挂载", "正在运行业务：无畏契约", "同步成功！"];
            for(let s of steps) {
                addLog(s);
                await new Promise(r => setTimeout(r, 1000));
            }
        }
    </script>
</body>
</html>
