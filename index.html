<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System - Remote Sharing</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --dark: #0f172a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
        }

        /* 观众模式：对方进入时只看终端 */
        body.viewer-mode .header, 
        body.viewer-mode .instance-grid { display: none !important; }
        body.viewer-mode .content { padding: 0; }
        body.viewer-mode .terminal-wrapper { flex: 1; width: 100vw; height: 100vh; border-radius: 0; border: none; min-width: 100%; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 72px;
            background-color: var(--card-bg);
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            z-index: 10;
        }

        .top-configs {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .config-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--bg);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .config-label {
            color: #64748b;
            font-size: 13px;
        }

        .config-input {
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            outline: none;
            font-family: 'Consolas', monospace;
        }

        .game-select {
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            outline: none;
            cursor: pointer;
            padding-right: 8px;
        }

        .global-actions {
            display: flex;
            gap: 12px;
        }

        .btn-master {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-master:hover {
            background-color: var(--primary-hover);
        }

        .btn-share {
            background-color: #6366f1;
            font-size: 13px;
            padding: 10px 16px;
        }

        .btn-pause {
            background-color: var(--warning);
            display: none; 
        }

        .content {
            flex: 1;
            padding: 24px;
            display: flex;
            gap: 20px;
            overflow: hidden;
        }

        .instance-grid {
            flex: 4; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            overflow-y: auto;
            padding-right: 12px;
            align-content: start;
            scroll-behavior: smooth;
        }

        .instance-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 16px 20px;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #cbd5e1;
            transition: all 0.3s;
        }

        .instance-card.connecting {
            border-left-color: var(--warning);
            background-color: #fffbeb;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .instance-card.active {
            border-left-color: var(--success);
            background-color: #f0fdf4;
            border-color: rgba(16, 185, 129, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
        }

        .card-user {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .card-id-ip {
            font-family: 'Consolas', 'Courier New', monospace;
            color: var(--text-light);
            font-size: 12px;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .status-badge {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
        }

        .terminal-wrapper {
            flex: 1; 
            background-color: #1e1e1e;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            border: 1px solid #333;
            overflow: hidden;
            min-width: 350px; 
        }

        .terminal-header {
            background-color: #2d2d2d;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid #111;
        }

        .mac-dots {
            position: absolute;
            left: 12px;
            display: flex; gap: 6px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.r { background-color: #ff5f56; }
        .dot.y { background-color: #ffbd2e; }
        .dot.g { background-color: #27c93f; }

        .terminal-title {
            color: #8e8e93; font-size: 12px;
        }

        .terminal-body {
            padding: 12px 16px;
            flex: 1;
            overflow-y: auto;
            color: #d4d4d4; 
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace; 
            font-size: 12px; 
            line-height: 1.5;
            word-break: break-all;
        }

        .log-entry { margin-bottom: 5px; }
        .log-time { color: #6b7280; margin-right: 8px; }
        .log-info { color: #38bdf8; }
        .log-warn { color: #facc15; }
        .log-succ { color: #4ade80; }
        .log-sys  { color: #c084fc; font-weight: bold; }
        .log-gray { color: #9ca3af; }

        .cursor-blink {
            display: inline-block; width: 7px; height: 13px;
            background-color: #9ca3af; vertical-align: middle;
            margin-left: 4px; animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header">
            <div class="top-configs">
                <div class="config-box">
                    <span class="config-label">登录账号:</span>
                    <input type="text" class="config-input" id="auth-account" value="Guest_User_998" style="width: 130px;">
                </div>
                <div class="config-box">
                    <span class="config-label">运行业务:</span>
                    <select id="game-target" class="game-select">
                        <option value="无畏契约">无畏契约</option>
                        <option value="穿越火线">穿越火线</option>
                        <option value="三角洲行动">三角洲行动</option>
                    </select>
                </div>
                <div class="config-box">
                    <span class="config-label">配额:</span>
                    <input type="number" class="config-input" id="exec-count" value="200" style="width: 50px;">
                </div>
            </div>
            <div class="global-actions">
                <button class="btn-master btn-share" id="share-btn" onclick="initRemoteShare()">🔗 远程分享</button>
                <button class="btn-master" id="execute-btn" onclick="startDeployment()">⚡ 一键运行</button>
                <button class="btn-master btn-pause" id="pause-btn" onclick="togglePause()">⏸ 暂停</button>
            </div>
        </div>

        <div class="content">
            <div class="instance-grid" id="instance-container"></div>

            <div class="terminal-wrapper">
                <div class="terminal-header">
                    <div class="mac-dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
                    <span class="terminal-title">root@system-core: ~</span>
                </div>
                <div class="terminal-body" id="terminal-body">
                    <div class="log-entry"><span class="log-gray">Last login: <span id="init-time"></span> on ttys001</span></div>
                    <div id="cursor-anchor"><span class="cursor-blink"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script>

        const coreRegionList = [

, district: "中山区" }, { city: "鞍山市", district: "铁东区" }, { city: "合肥市", district: "蜀山区" }, { city: "芜湖市", district: "镜湖区" }, { city: "南昌市", district: "东湖区" }, { city: "九江市", district: "浔阳区" }, { city: "赣州市", district: "章贡区" }, { city: "南宁市", district: "青秀区" }, { city: "柳州市", district: "城中区" }, { city: "桂林市", district: "秀峰区" }, { city: "昆明市", district: "五华区" }, { city: "贵阳市", district: "南明区" }, { city: "太原市", district: "迎泽区" }, { city: "海口市", district: "美兰区" }, { city: "三亚市", district: "吉阳区" }, { city: "长春市", district: "朝阳区" }, { city: "吉林市", district: "船营区" }, { city: "哈尔滨市", district: "南岗区" }, { city: "大庆市", district: "萨尔图区" }, { city: "呼和浩特市", district: "新城区" }, { city: "包头市", district: "昆都仑区" }, { city: "兰州市", district: "城关区" }, { city: "银川市", district: "兴庆区" }, { city: "西宁市", district: "城中区" }, { city: "乌鲁木齐市", district: "天山区" }, { city: "大理州", district: "大理市" }, { city: "克拉玛依市", district: "独山子区" }, { city: "呼伦贝尔市", district: "海拉尔区" }, { city: "晋中市", district: "榆次区" }, { city: "延安市", district: "宝塔区" }, { city: "遵义市", district: "汇川区" }, { city: "曲靖市", district: "麒麟区" }, { city: "许昌市", district: "魏都区" }, { city: "焦作市", district: "解放区" }, { city: "齐齐哈尔市", district: "龙沙区" }, { city: "牡丹江市", district: "西安区" }, { city: "松原市", district: "宁江区" }, { city: "通辽市", district: "科尔沁区" }, { city: "赤峰市", district: "红山区" }, { city: "咸宁市", district: "咸安区" }, { city: "黄石市", district: "下陆区" }, { city: "株洲市", district: "天元区" }, { city: "张家界市", district: "永定区" }, { city: "郴州市", district: "北湖区" }, { city: "河源市", district: "源城区" }, { city: "清远市", district: "清城区" }, { city: "阳江市", district: "江城区" }, { city: "潮州市", district: "湘桥区" }, { city: "梅州市", district: "梅江区" }, { city: "自贡市", district: "大安区" }, { city: "攀枝花市", district: "东区" }, { city: "泸州市", district: "江阳区" }, { city: "德阳市", district: "旌阳区" }, { city: "广元市", district: "利州区" }, { city: "遂宁市", district: "船山区" }, { city: "内江市", district: "市中区" }, { city: "乐山市", district: "市中区" }, { city: "巴中市", district: "巴州区" }, { city: "雅安市", district: "雨城区" }, { city: "资阳市", district: "雁江区" }, { city: "拉萨市", district: "城关区" }, { city: "日喀则市", district: "桑珠孜区" }, { city: "林芝市", district: "巴宜区" }, { city: "延吉市", district: "延吉市" }, { city: "开封市", district: "龙亭区" }, { city: "平顶山市", district: "卫东区" }, { city: "安阳市", district: "文峰区" }, { city: "鹤壁市", district: "淇滨区" }, { city: "漯河市", district: "召陵区" }, { city: "濮阳市", district: "华龙区" }, { city: "三门峡市", district: "湖滨区" }, { city: "商丘市", district: "梁园区" }, { city: "周口市", district: "川汇区" }, { city: "驻马店市", district: "驿城区" }, { city: "信阳市", district: "河区" }, { city: "南平市", district: "延平区" }, { city: "三明市", district: "梅列区" }, { city: "莆田市", district: "城厢区" }, { city: "龙岩市", district: "新罗区" }, { city: "抚州市", district: "临川区" }, { city: "宜春市", district: "袁州区" }, { city: "吉安市", district: "青原区" }, { city: "上饶市", district: "信州区" }, { city: "萍乡市", district: "安源区" }, { city: "景德镇市", district: "珠山区" }, { city: "新余市", district: "渝水区" }, { city: "鹰潭市", district: "月湖区" }, { city: "马鞍山市", district: "花山区" }, { city: "淮北市", district: "相山区" }, { city: "淮南市", district: "田家庵区" }, { city: "铜陵市", district: "铜官区" }, { city: "安庆市", district: "宜秀区" }, { city: "黄山市", district: "屯溪区" }, { city: "滁州市", district: "琅琊区" }, { city: "阜阳市", district: "颍州州区" }, { city: "宿州市", district: "埇桥区" }, { city: "六安市", district: "金安区" }, { city: "亳州市", district: "谯城区" }, { city: "池州市", district: "贵池区" }, { city: "宣城市", district: "宣州区" }, { city: "曲阳县", district: "曲阳" }, { city: "迁安市", district: "迁安" }
        ];

        const getRealisticIP = (cityName) => {
            const ipMap = {
                "北京": ["114.240", "114.242", "220.181", "106.37"],
                "上海": ["101.226", "101.230", "116.228", "114.80"],
                "广州": ["14.116", "113.65", "119.129", "121.33"],
                "深圳": ["14.18", "113.89", "119.136", "121.35"],
                "成都": ["125.69", "118.113", "171.220", "218.89"],
                "杭州": ["115.238", "122.225", "60.190", "183.136"]
            };
            const defaultPrefixes = ["27.16", "36.96", "49.64", "58.14", "112.10", "117.10", "118.10", "121.10", "220.10"];
            let cleanCity = cityName.replace(/[省市]/g, "");
            const prefix = (ipMap[cleanCity] || defaultPrefixes)[Math.floor(Math.random() * (ipMap[cleanCity] || defaultPrefixes).length)];
            return `${prefix}.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*254)+1}`;
        };

        const generateWindowsUser = (index) => {
            const pattern = [`PC-USER-${Math.floor(Math.random()*800+100)}`, `Administrator`, `DESKTOP-${Math.random().toString(36).substring(2,9).toUpperCase()}`, `USER-STATION-${String(index + 1).padStart(3, '0')}`, `WORK-PC-${Math.floor(Math.random() * 900 + 100)}` ];
            return pattern[index % pattern.length];
        };

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; }
            return array;
        }

        const ordinaryShuffled = shuffleArray([...ordinaryRegionList]);
        const finalMergedRegions = [...coreRegionList, ...ordinaryShuffled].slice(0, 200);

        const instances = finalMergedRegions.map((reg, index) => {
            return { id: `Node-${String(index + 1).padStart(3, '0')}`, region: `${reg.city}${reg.district}`, computerUser: generateWindowsUser(index), ip: getRealisticIP(reg.city) };
        });

        // --- 远程分享核心插件逻辑 ---
        let peer = null;
        let connections = [];
        let isPaused = false;
        let isRunning = false;

        window.addEventListener('DOMContentLoaded', () => {
            renderInstances();
            document.getElementById('init-time').innerText = new Date().toLocaleString();
            
            const urlParams = new URLSearchParams(window.location.search);
            const joinId = urlParams.get('join');
            if (joinId) {
                document.body.classList.add('viewer-mode');
                const vPeer = new Peer();
                vPeer.on('open', () => {
                    const conn = vPeer.connect(joinId);
                    conn.on('data', (d) => {
                        if (d.t === 'INIT') document.getElementById('terminal-body').innerHTML = d.h;
                        if (d.t === 'LOG') printSysLog(d.m, d.ty, false);
                    });
                });
            }
        });

        function initRemoteShare() {
            if (peer) {
                const url = window.location.href.split('?')[0] + '?join=' + peer.id;
                navigator.clipboard.writeText(url);
                alert("链接已重新复制！"); return;
            }
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('share-btn').innerHTML = `✅ ID: ${id}`;
                const url = window.location.href.split('?')[0] + '?join=' + id;
                navigator.clipboard.writeText(url);
                alert("分享子链接已复制！发给对方打开即可。");
            });
            peer.on('connection', (c) => {
                connections.push(c);
                c.on('open', () => c.send({ t: 'INIT', h: document.getElementById('terminal-body').innerHTML }));
            });
        }

        // --- 你的业务逻辑 ---
        function renderInstances() {
            const container = document.getElementById('instance-container');
            container.innerHTML = '';
            instances.forEach((inst, index) => {
                const card = document.createElement('div');
                card.className = 'instance-card'; card.id = `card-${index}`;
                card.innerHTML = `<div class="card-header"><div class="card-title">${inst.region}</div><div class="status-badge" id="badge-${index}">IDLE</div></div><div class="card-user">电脑用户名: ${inst.computerUser}</div><div class="card-id-ip">IP: ${inst.ip}</div>`;
                container.appendChild(card);
            });
        }

        function printSysLog(message, type = 'gray', broadcast = true) {
            const terminal = document.getElementById('terminal-body');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${message}</span>`;
            terminal.insertBefore(entry, document.getElementById('cursor-anchor'));
            terminal.scrollTop = terminal.scrollHeight;
            if (broadcast && connections.length > 0) {
                connections.forEach(c => c.send({ t: 'LOG', m: message, ty: type }));
            }
        }

        async function startDeployment() {
            if (isRunning) return; isRunning = true;
            const btn = document.getElementById('execute-btn');
            const targetGame = document.getElementById('game-target').value;
            let reqCount = parseInt(document.getElementById('exec-count').value) || 10;
            btn.innerText = "执行中...";
            
            printSysLog(`[系统] 任务启动：开始执行序列...`, 'sys');
            for (let i = 0; i < reqCount; i++) {
                const card = document.getElementById(`card-${i}`);
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                card.className = 'instance-card connecting';
                await new Promise(r => setTimeout(r, 1000));
                printSysLog(`[网络] 正在连接 -> ${instances[i].ip}`, 'gray');
                await new Promise(r => setTimeout(r, 1000));
                card.className = 'instance-card active';
                document.getElementById(`badge-${i}`).innerText = "ONLINE";
                printSysLog(`[成功] 节点 ${i+1} 已登录 <${targetGame}>`, 'succ');
            }
            isRunning = false; btn.innerText = "执行完毕";
        }
    </script>
</body>
</html>
